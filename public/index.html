<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .section {
            margin-bottom: 20px;
        }
        .health-check {
            background-color: #e6f7ff;
            padding: 10px;
            border: 1px solid #b3e0ff;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Football Calculator</h1>
        <div class="section" id="matches">
            <h2>Matches</h2>
            <p>Calculates outcomes based on statistics.</p>
            <button onclick="calculateMatch()">Calculate Match</button>
        </div>
        <div class="section" id="team-stats">
            <h2>Team Statistics</h2>
            <p>View and analyze team statistics.</p>
            <button onclick="viewStats()">View Statistics</button>
        </div>
        <div class="section health-check" id="health-check">
            <h2>Server Health Check</h2>
            <button onclick="checkHealth()">Check Health</button>
            <div id="health-status"></div>
        </div>
    </div>
    <script>
        function calculateMatch() {
            alert('Match calculation initiated!');
            // Add your match calculation logic here
        }

        function viewStats() {
            alert('Statistics viewed!');
            // Add your team statistics logic here
        }

        function checkHealth() {
            document.getElementById('health-status').innerText = 'Server is running smoothly!';
        }
    </script>
</body>
</html>
